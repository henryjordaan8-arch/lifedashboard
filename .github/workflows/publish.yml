# Free hosting: sync Garmin + calendar every hour and publish the dashboard to
# GitHub Pages. The data is encrypted with DASHBOARD_PASSWORD before it's
# published, and decrypted in your browser. Setup: see PAGES.md.
name: Publish dashboard

on:
  schedule:
    - cron: "7 * * * *" # hourly (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: # Actions tab → "Run workflow" = sync right now
  push:
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

concurrency:
  group: publish-dashboard
  cancel-in-progress: false

jobs:
  build:
    # Off until you create the repository variable PUBLISH_DASHBOARD = true (see PAGES.md).
    # Only the default branch publishes; other branches and forks never see the secrets.
    if: vars.PUBLISH_DASHBOARD == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: ${{ vars.TZ || 'UTC' }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
      GCAL_ICS_URLS: ${{ secrets.GCAL_ICS_URLS }}
      GCAL_TRAINING_ICS_URLS: ${{ secrets.GCAL_TRAINING_ICS_URLS }}
      GCAL_WORK_ICS_URLS: ${{ secrets.GCAL_WORK_ICS_URLS }}
      GCAL_STUDY_ICS_URLS: ${{ secrets.GCAL_STUDY_ICS_URLS }}
      GCAL_READING_ICS_URLS: ${{ secrets.GCAL_READING_ICS_URLS }}
      GCAL_PERSONAL_ICS_URLS: ${{ secrets.GCAL_PERSONAL_ICS_URLS }}
      KEY_SESSION_KEYWORDS: ${{ vars.KEY_SESSION_KEYWORDS }}
      DB_PATH: data/lifedashboard.sqlite3
      GARMIN_TOKENSTORE: data/garmin
    steps:
      - name: Check setup
        run: |
          if [ ${#DASHBOARD_PASSWORD} -lt 12 ]; then
            echo "::error::Add a DASHBOARD_PASSWORD secret of at least 12 characters (Settings → Secrets and variables → Actions). See PAGES.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Synced history + the (refreshed) Garmin login, kept between runs. It's
      # encrypted because caches of a public repo aren't secret.
      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: dashboard-state-${{ github.run_id }}
          restore-keys: dashboard-state-

      - name: Unlock saved data
        run: |
          if [ -f state.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DASHBOARD_PASSWORD -in state.enc \
              | tar xz -C backend \
              || echo "::warning::Saved data couldn't be opened (password changed?). Starting a fresh sync."
          fi

      - name: Install
        run: pip install --quiet -r backend/requirements.txt

      - name: Sync and build the encrypted snapshot
        working-directory: backend
        run: python -m scripts.build_snapshot --out ../frontend/public/data.enc

      - name: Lock saved data
        if: always()
        run: |
          if [ -d backend/data ]; then
            tar cz -C backend data \
              | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DASHBOARD_PASSWORD -out state.enc
          fi

      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: dashboard-state-${{ github.run_id }}

      - name: Build the dashboard
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
